<body>
<a class="skip" href="#catalog">Skip to sites</a>

<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="./" aria-label="Home">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span class="brand-name" data-config="title">Tech Explainers</span>
    </a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light or dark theme" title="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<main>
  <section class="hero wrap">
    <p class="prompt"><span class="ps1" data-config="prompt">~/explainers</span> <span class="cmd">ls --by-category</span><span class="caret" aria-hidden="true"></span></p>
    <h1>How computers <em>really</em> work, one hands-on page at a time.</h1>
    <p class="tagline" data-config="tagline"></p>
    <dl class="stats" id="stats"></dl>
  </section>

  <section class="wrap featured-wrap" id="featuredWrap" hidden>
    <h2 class="section-label">Start here</h2>
    <div class="featured" id="featured"></div>
  </section>

  <section class="wrap" id="catalog" aria-label="All sites">
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search topics, tags…" autocomplete="off" aria-label="Search sites">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>
    </div>

    <div id="sections"></div>
    <p class="empty" id="empty" hidden>No sites match that. Try a different word or clear the filter.</p>
  </section>
</main>

<footer class="wrap foot">
  <p>Built as plain HTML on GitHub Pages. <span id="updated"></span></p>
